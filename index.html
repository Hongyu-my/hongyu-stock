<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库存实时看板</title>
<style>
  :root{
    --bg:#FFF8E7; --card:#FFFFFF; --main:#F5A623; --main2:#FFB84D;
    --ink:#4A3B1A; --sub:#9A8B6B; --line:#F0E4C8;
    --ok:#1f9d6b; --warn:#f0a020; --danger:#d64545;
    --sidebarW: 210px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;}
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:var(--sidebarW);background:#fff7e0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;
    box-shadow:2px 0 10px rgba(180,140,40,.06);
  }
  .brand{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .brand svg{width:40px;height:40px;flex:0 0 auto}
  .brand h1{font-size:17px;margin:0;font-weight:800;line-height:1.2}
  .brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
  .series-list{flex:1;overflow-y:auto;padding:10px 12px}
  .series-btn{
    width:100%;text-align:left;border:none;background:#fff;border-radius:12px;
    padding:11px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;color:var(--ink);
    border:1px solid var(--line);transition:.15s;display:flex;align-items:center;justify-content:space-between;
  }
  .series-btn:hover{background:#fff3da}
  .series-btn.active{background:var(--main);color:#fff;border-color:var(--main);box-shadow:0 4px 12px rgba(245,166,35,.25)}
  .series-btn.active .sname{color:#fff}
  .series-btn.active .scount{background:rgba(255,255,255,.25);color:#fff}
  .series-btn .sname{font-weight:700}
  .series-btn .scount{font-size:11px;background:var(--bg);color:var(--sub);padding:2px 8px;border-radius:20px}
  .all-btn{font-weight:800}
  .main{margin-left:var(--sidebarW);flex:1;min-width:0}
  .content{max-width:1080px;margin:0 auto;padding:22px 22px 50px}
  header{margin-bottom:18px}
  header .upd{font-size:12px;color:var(--sub);margin-top:5px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--card);border-radius:16px;padding:16px 18px;cursor:pointer;
    box-shadow:0 4px 14px rgba(180,140,40,.08);border:1px solid var(--line);transition:.15s}
  .stat:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(180,140,40,.12)}
  .stat.active-filter{outline:3px solid rgba(245,166,35,.35)}
  .stat .n{font-size:28px;font-weight:800;line-height:1.1}
  .stat .l{font-size:12px;color:var(--sub);margin-top:6px}
  .stat.s-total .n{color:var(--main)}
  .stat.s-stock .n{color:#3a72f0}
  .stat.s-warn .n{color:var(--warn)}
  .stat.s-danger .n{color:var(--danger)}
  .stat.s-ok .n{color:var(--ok)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{font-size:14px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);outline:none}
  .toolbar input{flex:1;min-width:180px}
  .toolbar .hint{font-size:12px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;
    overflow:hidden;box-shadow:0 4px 14px rgba(180,140,40,.08)}
  th,td{padding:11px 13px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:#FFF3DA;color:#8a6d2f;font-weight:700;cursor:pointer;user-select:none;position:sticky;top:0}
  tbody tr:hover{background:#FFFBF0}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .b-ok{background:#e3f7ec;color:var(--ok)}
  .b-warn{background:#fdeccb;color:var(--warn)}
  .b-danger{background:#fbe3e3;color:var(--danger)}
  .series-tag{display:inline-block;background:#FFF3DA;color:#a87b25;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
  .low-row{background:#FFF1F1 !important}
  .danger-row{background:#FDEFEF !important}
  footer{margin-top:30px;text-align:center;font-size:12px;color:var(--sub)}
  .empty{padding:40px;text-align:center;color:var(--sub);font-size:14px;background:var(--card);border-radius:14px}
  .series-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .ss-chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px}
  .ss-chip b{color:var(--main)}
  .paste-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(180,140,40,.06)}
  .paste-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .paste-head h3{font-size:14px;margin:0;color:var(--ink);font-weight:700}
  .paste-head .toggle{font-size:12px;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:10px}
  .paste-body{display:none;margin-top:12px}
  .paste-body.open{display:block}
  .paste-box textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--ink);resize:vertical;outline:none}
  .paste-box textarea:focus{border-color:var(--main)}
  .paste-btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .paste-btns button{font-size:13px;padding:8px 16px;border:none;border-radius:10px;cursor:pointer}
  .btn-primary{background:var(--main);color:#fff;font-weight:700}
  .btn-secondary{background:#f0e4c8;color:var(--ink)}
  .paste-tip{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
  .import-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff8e8;border:1px dashed var(--main);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .import-row .lbl{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
  .import-row input[type=file]{font-size:12px;color:var(--sub);flex:1;min-width:180px}
  .paste-divider{font-size:12px;color:var(--sub);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .paste-divider::before,.paste-divider::after{content:'';flex:1;height:1px;background:var(--line)}
  @media(max-width:860px){
    .sidebar{position:relative;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .app{flex-direction:column}
    .main{margin-left:0}
    .series-list{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
    .series-btn{width:auto;margin-bottom:0}
    .content{padding:16px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#FFB84D"/><circle cx="22" cy="20" r="8" fill="#FFB84D"/><circle cx="42" cy="20" r="8" fill="#FFB84D"/><circle cx="25" cy="32" r="3" fill="#4A3B1A"/><circle cx="39" cy="32" r="3" fill="#4A3B1A"/><path d="M26 40 q6 5 12 0" stroke="#4A3B1A" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="20" y="50" width="24" height="9" rx="3" fill="#F5A623"/></svg>
      <div>
        <h1>库存实时看板</h1>
        <small>本地 ERP 数据</small>
      </div>
    </div>
    <div class="series-list" id="seriesList">
      <button class="series-btn all-btn active" data-s=""><span class="sname">📦 全部系列</span><span class="scount" id="allCount">0</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="content">
      <header>
        <div class="upd">数据更新时间：<span id="upd"></span> ｜ 来源：本地 ERP</div>
      </header>
      <div class="stats" id="stats"></div>
      <div class="series-summary" id="seriesSummary"></div>

      <div class="paste-box" id="pasteBox">
        <div class="paste-head" onclick="togglePaste()">
          <h3>🔄 手动更新数据</h3>
          <span class="toggle" id="pasteToggle">展开 ▼</span>
        </div>
        <div class="paste-body" id="pasteBody">
          <div class="import-row">
            <span class="lbl">📥 导入 ERP 导出的 CSV 文件</span>
            <input type="file" id="csvFile" accept=".csv,.txt" onchange="handleCsvFile(this)">
          </div>
          <div class="paste-divider">或者：手动复制粘贴表格</div>
          <textarea id="pasteArea" placeholder="登录 ERP → 选中库存表格 → Ctrl+C 复制 → 回到这里 Ctrl+V 粘贴 → 点「应用粘贴数据」"></textarea>
          <div class="paste-btns">
            <button class="btn-primary" onclick="applyPaste()">应用粘贴数据</button>
            <button class="btn-secondary" onclick="restoreAuto()">恢复自动抓取数据</button>
          </div>
          <div class="paste-tip">只要保留这个 HTML 文件，不装任何软件、不依赖我的脚本，双击打开就能自己刷新。</div>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" placeholder="🔍 搜型号 / 名称…">
        <select id="fStatus">
          <option value="">全部状态</option>
          <option value="正常">正常</option>
          <option value="需补货">需补货</option>
          <option value="缺货">缺货</option>
        </select>
        <button class="btn-primary" id="liveBtn" onclick="fetchLive()">🔄 拉取最新（ERP 实时）</button>
        <span class="hint">点表头可排序；点上方「需补货/缺货」卡片可快速筛选</span>
        <script>
          /* 「拉取最新」用的是相对路径 /api/inventory，只有页面与 ERP 同源时才有效。
             故仅在办公室局域网 / 本机 ERP 地址下显示；GitHub Pages 等静态托管下点了无反应，隐藏以免误导。
             本地 file:// 直接打开同理（相对路径解析不到 ERP），一并隐藏。 */
          (function(){
            var h = location.hostname || '';
            var isErpOrigin = /^(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})$/.test(h);
            var b = document.getElementById('liveBtn');
            if (b && !isErpOrigin) { b.style.display = 'none'; }
          })();
        </script>
      </div>
      <table id="invTable">
        <thead><tr>
          <th data-k="系列">系列</th><th data-k="型号">型号</th><th data-k="名称">名称</th>
          <th data-k="当前库存">当前库存</th><th data-k="阈值">阈值</th><th data-k="状态">状态</th>
        </tr></thead>
        <tbody id="invBody"></tbody>
      </table>
      <footer>离线可用 ｜ 每天自动同步 ERP ｜ 可直接用浏览器打开本文件</footer>
    </div>
  </main>
</div>

function bd(cls,n,l,statusFilter){
  const active = statusFilter && curStatus===statusFilter ? 'active-filter' : '';
  return `<div class="stat ${cls} ${active}" data-filter="${statusFilter||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
}

function recompute(){
  const items = DATA.items;
  const status = {};
  items.forEach(it=>status[it['状态']]=(status[it['状态']]||0)+1);
  DATA.stats = {total:items.length, status, total_stock: items.reduce((a,b)=>a+b['当前库存'],0)};
  DATA.series = Array.from(new Set(items.map(i=>i['系列']))).sort();
  DATA.series_stats = {};
  DATA.series.forEach(s=>{
    const sitems = items.filter(i=>i['系列']===s);
    const sc={};
    sitems.forEach(it=>sc[it['状态']]=(sc[it['状态']]||0)+1);
    DATA.series_stats[s]={total:sitems.length, total_stock:sitems.reduce((a,b)=>a+b['当前库存'],0), status:sc};
  });
}

function renderStats(sc){
  $('#stats').innerHTML =
    bd('s-total', sc.total, 'SKU 总数', '') +
    bd('s-stock', sc.total_stock, '当前总库存', '') +
    bd('s-warn', (sc.status['需补货']||0), '需补货', '需补货') +
    bd('s-danger', (sc.status['缺货']||0), '缺货', '缺货') +
    bd('s-ok', (sc.status['正常']||0), '正常', '正常');
  $$('.stat[data-filter]').forEach(el=>{
    const f=el.dataset.filter;
    el.onclick=()=>{
      if(curStatus===f) curStatus=''; else curStatus=f;
      $('#fStatus').value=curStatus;
      render();
    };
  });
}

function renderSeriesNav(){
  const box=$('#seriesList');
  // 保留「全部」按钮，重建系列按钮
  box.innerHTML='<button class="series-btn all-btn" data-s=""><span class="sname">📦 全部系列</span><span class="scount" id="allCount">0</span></button>';
  DATA.series.forEach(s=>{
    const st=DATA.series_stats[s];
    const btn=document.createElement('button');
    btn.className='series-btn';
    btn.dataset.s=s;
    btn.innerHTML=`<span class="sname">${s} 系列</span><span class="scount">${st.total}</span>`;
    box.appendChild(btn);
  });
  $('#allCount').textContent=DATA.stats.total;
  $$('.series-btn').forEach(b=>b.onclick=()=>{curSeries=b.dataset.s;updateActive();render();});
  updateActive();
}
function updateActive(){
  $$('.series-btn').forEach(b=>b.classList.toggle('active', b.dataset.s===curSeries));
}
function renderSeriesSummary(sc){
  const chips=[];
  if(curSeries){
    chips.push(`<div class="ss-chip">当前系列：<b>${curSeries}</b></div>`);
    chips.push(`<div class="ss-chip">SKU：<b>${sc.total}</b></div>`);
    chips.push(`<div class="ss-chip">库存：<b>${sc.total_stock}</b></div>`);
    if(sc.status['缺货']) chips.push(`<div class="ss-chip">缺货：<b style="color:var(--danger)">${sc.status['缺货']}</b></div>`);
    if(sc.status['需补货']) chips.push(`<div class="ss-chip">需补货：<b style="color:var(--warn)">${sc.status['需补货']}</b></div>`);
  } else {
    chips.push(`<div class="ss-chip">全部系列：<b>${DATA.series.length}</b> 个</div>`);
  }
  $('#seriesSummary').innerHTML=chips.join('');
}

function getFiltered(){
  let list=DATA.items;
  if(curSeries) list=list.filter(i=>i['系列']===curSeries);
  if(curStatus) list=list.filter(i=>i['状态']===curStatus);
  if(curSearch){
    const q=curSearch.toLowerCase();
    list=list.filter(i=>(i['型号']+i['名称']).toLowerCase().includes(q));
  }
  if(sortKey){
    list=list.slice().sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av==='number' && typeof bv==='number') return sortDesc?bv-av:av-bv;
      av=String(av||''); bv=String(bv||'');
      return sortDesc?bv.localeCompare(av):av.localeCompare(bv);
    });
  }
  return list;
}
function render(){
  let list=getFiltered();
  const sc = curSeries ? DATA.series_stats[curSeries] : DATA.stats;
  renderStats(sc);
  renderSeriesSummary(sc);

  $('#invBody').innerHTML = list.length ? list.map(it=>`
    <tr class="${fmtRowCls(it['状态'])}">
      <td><span class="series-tag">${it['系列']}</span></td>
      <td>${it['型号']}</td>
      <td>${it['名称']}</td>
      <td>${it['当前库存']}</td>
      <td>${it['阈值']}</td>
      <td>${fmtStatus(it['状态'])}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="empty">没有匹配的记录</td></tr>`;
}

function toInt(v){
  const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);
  return isNaN(n)?0:n;
}
function decodeBuf(buf){
  const u8=new Uint8Array(buf);
  let s='';
  try{ s=new TextDecoder('utf-8').decode(u8); }catch(e){ s=''; }
  if(s && s.indexOf('\uFFFD')===-1) return s;
  try{ return new TextDecoder('gbk').decode(u8); }catch(e){ return s; }
}
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const first=(text.split('\n')[0]||'');
  const sep=(first.indexOf('\t')>=0)?'\t':',';
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===sep){ row.push(cur);cur=''; }
      else if(ch==='\n'){ row.push(cur);rows.push(row);row=[];cur=''; }
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur);rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}
function rowsToItems(rows){
  let startIdx=0;
  if(rows.length && (rows[0].join('').includes('型号')||rows[0].join('').includes('系列')||rows[0].join('').includes('名称'))) startIdx=1;
  const out=[];
  for(let i=startIdx;i<rows.length;i++){
    const cols=rows[i];
    if(cols.length<5) continue;
    const stock=toInt(cols[3]),threshold=toInt(cols[4]);
    let status=cols[5]||'';
    if(stock<=0) status='缺货';
    else if(stock<=threshold) status='需补货';
    else status='正常';
    out.push({'系列':cols[0],'型号':cols[1],'名称':cols[2],'当前库存':stock,'阈值':threshold,'状态':status});
  }
  return out;
}
function parsePasted(text){ return rowsToItems(parseCsv(text)); }
function applyItems(list,msg){
  DATA.items=list;
  DATA.updated=new Date().toLocaleString('zh-CN',{hour12:false});
  recompute();renderSeriesNav();render();
  alert(msg);
}
function fetchLive(){
  var btn=document.getElementById('liveBtn');
  if(btn){btn.disabled=true;btn.textContent='拉取中…';}
  fetch('/api/inventory',{credentials:'same-origin'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(j){
      if(!Array.isArray(j)||!j.length) throw new Error('接口没返回数据');
      var items=j.map(function(o){
        var s=toInt(o['当前库存']),t=toInt(o['阈值']);
        return {'系列':String(o['系列']||''),'型号':String(o['型号']||''),'名称':String(o['名称']||''),
                '当前库存':s,'阈值':t,'状态':(s<=0?'缺货':(s<=t?'需补货':'正常'))};
      });
      applyItems(items,'已拉取 '+items.length+' 条实时库存');
    })
    .catch(function(e){
      alert('实时拉取失败：'+e.message+'\n\n请通过 ERP 看板地址打开本页面（登录后点此按钮即可实时刷新）：\nhttp://127.0.0.1:5000/stock-board\n\n直接双击本地文件打开时，浏览器安全策略不允许跨源读取数据。');
    })
    .then(function(){if(btn){btn.disabled=false;btn.textContent='🔄 拉取最新（ERP 实时）';}});
}
function handleCsvFile(input){
  const f=input.files && input.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=function(e){
    const parsed=rowsToItems(parseCsv(decodeBuf(e.target.result)));
    if(!parsed.length){ alert('没解析到有效数据。请确认 CSV 含这几列：系列、型号、名称、当前库存、阈值。'); input.value=''; return; }
    applyItems(parsed,'已导入 '+parsed.length+' 条库存记录');
    input.value='';
  };
  rd.onerror=function(){ alert('文件读取失败，换个文件试试'); input.value=''; };
  rd.readAsArrayBuffer(f);
}
function togglePaste(){
  const body=$('#pasteBody');
  const isOpen=body.classList.toggle('open');
  $('#pasteToggle').textContent=isOpen?'收起 ▲':'展开 ▼';
}
function applyPaste(){
  const raw=$('#pasteArea').value;
  if(!raw.trim()){alert('先粘贴表格内容再点应用');return;}
  const parsed=parsePasted(raw);
  if(!parsed.length){alert('没解析到有效数据。请从 ERP 库存页完整复制表格（含系列/型号/名称/当前库存/阈值几列）。');return;}
  DATA.items=parsed;
  DATA.updated=new Date().toLocaleString('zh-CN',{hour12:false});
  recompute();
  renderSeriesNav();
  render();
  $('#pasteArea').value='';
  alert(`已更新 ${parsed.length} 条库存记录`);
}
function restoreAuto(){
  DATA=JSON.parse(JSON.stringify(ORIGINAL_DATA));
  curSeries=''; curStatus=''; curSearch=''; sortKey=''; sortDesc=false;
  $('#search').value=''; $('#fStatus').value='';
  recompute();
  renderSeriesNav();
  render();
}

$('#upd').textContent=DATA.updated;
recompute();
renderSeriesNav();
$('#search').oninput=e=>{curSearch=e.target.value.trim();render();};
$('#fStatus').onchange=e=>{curStatus=e.target.value;render();};
$$('#invTable th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(sortKey===k) sortDesc=!sortDesc; else {sortKey=k; sortDesc=false;}
  render();
});
render();
</script>
